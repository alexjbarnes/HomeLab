services:
  roasta:
    image: ghcr.io/alexjbarnes/roasta:dev
    ports:
      - "3002:3002"
    environment:
      - AUTH_MODE=supabase
      - MARKETPLACE_ENABLED=true
      - DATABASE_TYPE=postgres
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3002
      - MIGRATIONS_PATH=/app/migrations
      - GIN_MODE=release
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRODUCT_MONTHLY=${STRIPE_PRODUCT_MONTHLY}
      - STRIPE_PRODUCT_ANNUAL=${STRIPE_PRODUCT_ANNUAL}
      # Images live on Cloudflare R2 behind this domain; the web app only
      # builds URLs from it and never talks to storage itself.
      - IMAGE_BASE_URL=https://images.roasta.co
    restart: unless-stopped
